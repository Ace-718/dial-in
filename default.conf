# Served by nginx inside the elina-web container (Coolify → Cloudflare in front).
# "no-cache" means: caches may store it, but must re-check with us before reusing it.
# This keeps every deploy visible immediately, including files that used to 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-cache" always;

    location = /manifest.json { default_type application/manifest+json; }

    location / {
        try_files $uri $uri/ =404;
    }
}
